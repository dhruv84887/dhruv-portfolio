<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#03040a" />
    <meta
      name="description"
      content="Personal portfolio of Dhruv, a Computer Science Engineering student interested in software development, AI, machine learning and modern web experiences."
    />
    <title>Dhruv | CSE Student • Developer • AI/ML Enthusiast</title>

    <!--
      Canonical URL — EDIT before deploying.
      `.example` is a reserved placeholder domain (RFC 2606): it can never
      resolve, so no invented production domain ships by accident.
      Replace with the real absolute URL, e.g. https://your-site.com/
    -->
    <link rel="canonical" href="https://your-domain.example/" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-domain.example/" />
    <meta
      property="og:title"
      content="Dhruv | CSE Student • Developer • AI/ML Enthusiast"
    />
    <meta
      property="og:description"
      content="Personal portfolio of Dhruv, a Computer Science Engineering student interested in software development, AI, machine learning and modern web experiences."
    />
    <meta property="og:site_name" content="Dhruv — Portfolio" />
    <meta property="og:locale" content="en" />

    <!-- Twitter / X preview -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Dhruv | CSE Student • Developer • AI/ML Enthusiast"
    />
    <meta
      name="twitter:description"
      content="Personal portfolio of Dhruv, a Computer Science Engineering student interested in software development, AI, machine learning and modern web experiences."
    />
    <!-- Prevents a white flash before the CSS bundle loads -->
    <style>
      html {
        background: #03040a;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
